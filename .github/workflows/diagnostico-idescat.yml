name: Diagnóstico de fuente municipal Idescat
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/inspect-idescat.mjs
      - name: Extraer cohortes de Barcelona y L'Hospitalet
        run: node scripts/extract-idescat.mjs
