name: Verificación técnica del comparador de pirámides
on:
  push:
    branches: [main, feat-lectura-comparada-academica-20261028]
  pull_request:
permissions:
  contents: read
jobs:
  unidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis
        run: |
          node --check lab/core.mjs
          node --check lab/main.mjs
          node --check lab/comparison-ui.mjs
          node --check lab/comparison-core.mjs
          node --check lab/academic-reading.mjs
          node --check lab/morphology.mjs
      - name: Probar funciones de demografía
        run: node --test tests/*.test.mjs
      - name: Comprobar recursos críticos
        run: |
          test -s index.html
          test -s lab/style.css
          test -s lab/core.mjs
          test -s lab/main.mjs
          test -s lab/comparison-core.mjs
          test -s lab/morphology.mjs
          test -s lab/comparison-ui.mjs
          test -s lab/comparison.css
          test -s clasico.html
          test -s payload/index.html.gz.b64
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar herramientas de pruebas (solo en CI)
        run: npm install --no-save @playwright/test @axe-core/playwright
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Ejecutar E2E y comprobación automática de accesibilidad
        run: npx playwright test
      - name: Conservar evidencias si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-y-registros-de-pruebas
          path: test-results/
