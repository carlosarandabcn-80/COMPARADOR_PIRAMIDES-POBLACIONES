name: Validación real de conexión web (Chromium)
on:
  push:
    branches: [fix-validacion-ine-eurostat-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegador-red-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test @axe-core/playwright
      - run: npx playwright install --with-deps chromium
      - name: Verificar CORS y respuesta reales INE y Eurostat
        env:
          RUN_LIVE_EXTERNAL: '1'
        run: npx playwright test tests/live-services.e2e.spec.mjs
