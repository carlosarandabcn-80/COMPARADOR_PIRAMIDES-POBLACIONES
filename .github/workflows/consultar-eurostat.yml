name: Comprobación externa Eurostat (informativa)
on:
  push:
    branches: [main, mejora-laboratorio-socioeducativo-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eurostat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar API real demo_pjan (resultado informativo)
        continue-on-error: true
        run: node scripts/check_eurostat.mjs
