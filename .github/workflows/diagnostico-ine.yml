name: Diagnóstico INE estructura de respuesta
on:
  push:
    branches: [redisenio-comparador-estructura-social-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico-ine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/diagnostico-ine.mjs
