name: Audit API Eurostat missing ages
on:
  push:
    branches: [fix-validacion-ine-eurostat-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-eurostat.mjs
