name: Comprobación de datos reales INE y Eurostat
on:
  push:
    branches: [main, feat-lectura-comparada-academica-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuentes-reales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar series históricas y actuales del INE y Eurostat
        run: node scripts/verificar-fuentes.mjs
